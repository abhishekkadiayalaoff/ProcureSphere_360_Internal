<div class="modal-header border-bottom border-secondary">
    <h5 class="modal-title text-dark fw-bold">
        <i class="fa-solid fa-gavel text-info me-2"></i> Create Sourcing Event (RFQ / RFP)
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<form method="POST" action="/sourcing-events/create/">
    {% csrf_token %}
    <div class="modal-body p-4">
        <div class="row g-3 mb-3">
            <div class="col-md-8">
                <label class="form-label text-dark fw-semibold small">Sourcing Title *</label>
                <input type="text" name="title" class="form-control" placeholder="e.g. Enterprise Core Network Switches RFQ" required>
            </div>
            <div class="col-md-4">
                <label class="form-label text-dark fw-semibold small">Event Type *</label>
                <select name="event_type" class="form-select" required>
                    <option value="RFQ">RFQ — Request for Quotation</option>
                    <option value="RFP">RFP — Request for Proposal</option>
                </select>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label text-dark fw-semibold small">Bidding Start Date *</label>
                <input type="date" name="bid_start_date" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label text-dark fw-semibold small">Bidding End Date (Sealed Close) *</label>
                <input type="date" name="bid_end_date" class="form-control" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label text-dark fw-semibold small">Source Purchase Requisition (Optional)</label>
            <select name="requisition_id" class="form-select">
                <option value="">Select Requisition...</option>
                {% for pr in requisitions %}
                    <option value="{{ pr.id }}">{{ pr.pr_number }} — {{ pr.title }} (${{ pr.total_amount|floatformat:2 }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label text-dark fw-semibold small">Technical & Commercial Specifications *</label>
            <textarea name="description" class="form-control" rows="3" placeholder="Specify technical requirements, SLA terms, delivery timelines..." required></textarea>
        </div>
    </div>

    <div class="modal-footer border-top border-secondary">
        <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-info rounded-pill px-4 fw-bold text-white shadow-sm">
            <i class="fa-solid fa-plus me-1"></i> Create Sourcing Event
        </button>
    </div>
</form>
