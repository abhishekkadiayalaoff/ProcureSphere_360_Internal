<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ProcureSphere 360 ERP — Hewlett Packard Enterprise{% endblock %}</title>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Custom Design System Styles -->
    <link href="/static/css/style.css" rel="stylesheet">
    <!-- HTMX Library -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Chart.js 4.4 JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="app-body">
    <!-- Header Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar shadow-sm sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center fw-bold text-white" href="/">
                <div class="brand-icon-box me-2">
                    <i class="fa-solid fa-cube text-cyan fs-5"></i>
                </div>
                <span>ProcureSphere <span class="text-cyan">360</span></span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto ms-lg-4">
                    <li class="nav-item">
                        <a class="nav-link px-3 active d-flex align-items-center" href="/">
                            <i class="fa-solid fa-chart-pie me-2"></i> Executive Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 d-flex align-items-center" href="/api/docs/">
                            <i class="fa-solid fa-code me-2"></i> OpenAPI Specs
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 d-flex align-items-center" href="/health/">
                            <i class="fa-solid fa-heart-pulse me-2"></i> System Health
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    {% if user.is_authenticated %}
                        <div class="user-pill me-3 d-flex align-items-center px-3 py-1 bg-dark-pill rounded-pill border border-secondary">
                            <i class="fa-solid fa-circle-user text-cyan me-2 fs-5"></i>
                            <div class="text-start leading-tight">
                                <div class="fw-semibold text-white small">{{ user.email }}</div>
                                <div class="badge bg-cyan text-dark rounded-pill" style="font-size: 0.65rem;">{{ user.role_code|default:"SUPER_ADMIN" }}</div>
                            </div>
                        </div>
                        <a href="/admin/logout/" class="btn btn-outline-light btn-sm rounded-pill px-3">
                            <i class="fa-solid fa-arrow-right-from-bracket me-1"></i> Sign Out
                        </a>
                    {% else %}
                        <a href="/admin/login/" class="btn btn-cyan btn-sm rounded-pill px-4 fw-semibold">
                            <i class="fa-solid fa-key me-1"></i> Sign In
                        </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Application Viewport -->
    <main class="container-fluid px-4 py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- HTMX Modal Container -->
    <div id="modal-container" class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content glass-card" id="modal-content-body">
                <!-- HTMX partial loaded dynamically here -->
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Application JS -->
    <script src="/static/js/app.js"></script>
</body>
</html>
