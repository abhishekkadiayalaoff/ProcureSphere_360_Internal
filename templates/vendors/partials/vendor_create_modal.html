<div class="modal-header border-bottom border-secondary">
    <h5 class="modal-title text-dark fw-bold">
        <i class="fa-solid fa-building-circle-check text-success me-2"></i> Onboard New Vendor
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<form method="POST" action="/vendors/create/">
    {% csrf_token %}
    <div class="modal-body p-4">
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label text-dark fw-semibold small">Legal Entity Name *</label>
                <input type="text" name="legal_name" class="form-control" placeholder="e.g. Cisco Systems Inc" required>
            </div>
            <div class="col-md-6">
                <label class="form-label text-dark fw-semibold small">Trade / Brand Name</label>
                <input type="text" name="trade_name" class="form-control" placeholder="e.g. Cisco Enterprise">
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label text-dark fw-semibold small">Tax Identification Number (TIN/VAT) *</label>
                <input type="text" name="tax_identification_number" class="form-control" placeholder="TAX-9988-US" required>
            </div>
            <div class="col-md-6">
                <label class="form-label text-dark fw-semibold small">Vendor Category *</label>
                <select name="category_id" class="form-select" required>
                    <option value="">Select Category...</option>
                    {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.name }} ({{ cat.code }})</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label text-dark fw-semibold small">Primary Email Address *</label>
                <input type="email" name="email" class="form-control" placeholder="sales@vendor.com" required>
            </div>
            <div class="col-md-6">
                <label class="form-label text-dark fw-semibold small">Contact Phone Number</label>
                <input type="text" name="phone" class="form-control" placeholder="+1 (800) 555-0199">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label text-dark fw-semibold small">Registered Physical Address *</label>
            <textarea name="address" class="form-control" rows="2" placeholder="Street, City, State, ZIP, Country" required></textarea>
        </div>

        <h6 class="fw-bold text-dark mt-4 mb-2 small text-uppercase" style="letter-spacing: 0.05em;">
            <i class="fa-solid fa-building-columns text-primary me-1"></i> Banking & Settlement Details
        </h6>
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label text-dark fw-semibold small">Bank Name</label>
                <input type="text" name="bank_name" class="form-control" placeholder="JPMorgan Chase">
            </div>
            <div class="col-md-4">
                <label class="form-label text-dark fw-semibold small">Account Number</label>
                <input type="text" name="bank_account_number" class="form-control" placeholder="ACCT-8849102">
            </div>
            <div class="col-md-4">
                <label class="form-label text-dark fw-semibold small">Routing / SWIFT Code</label>
                <input type="text" name="bank_routing_code" class="form-control" placeholder="ROUT-021000021">
            </div>
        </div>
    </div>

    <div class="modal-footer border-top border-secondary">
        <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-success rounded-pill px-4 fw-bold shadow-sm">
            <i class="fa-solid fa-plus me-1"></i> Register Vendor
        </button>
    </div>
</form>
